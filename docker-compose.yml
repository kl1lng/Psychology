services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisezim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?Set POSTGREST_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./backend/migrations/standalone_init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aisezim"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  postgrest:
    image: postgrest/postgrest:v16.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_DB_PASSWORD:?Set POSTGREST_DB_PASSWORD in .env}@db:5432/aisezim
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${INTERNAL_DATABASE_JWT_SECRET:?Set INTERNAL_DATABASE_JWT_SECRET in .env}
      PGRST_SERVER_PORT: 3001
    expose: ["3001"]
    networks: [private]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    environment:
      DATABASE_API_URL: http://postgrest:3001
      INTERNAL_DATABASE_JWT_SECRET: ${INTERNAL_DATABASE_JWT_SECRET:?Set INTERNAL_DATABASE_JWT_SECRET in .env}
      LOCAL_STORAGE_PATH: /data
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      APP_ENV: production
      ENABLE_DEV_TOOLS: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - media_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [private]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        INTERNAL_API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://backend:8000
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 20
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: ["vps"]
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
